services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoopla-dashboard
    restart: unless-stopped
    ports:
      - "3020:3020"
    environment:
      - NODE_ENV=production
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3020/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
